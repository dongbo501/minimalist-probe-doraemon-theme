  </g>
  <!-- 瞳孔 -->
  <ellipse cx="90" cy="64" rx="5.5" ry="7.5" fill="#0b2540"/>
  <ellipse cx="110" cy="64" rx="5.5" ry="7.5" fill="#0b2540"/>
  <circle cx="91.6" cy="61.4" r="2" fill="#ffffff"/>
  <circle cx="111.6" cy="61.4" r="2" fill="#ffffff"/>
