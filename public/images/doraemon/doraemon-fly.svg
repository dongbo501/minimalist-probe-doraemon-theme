<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 272">
  <defs>
    <radialGradient id="f-head" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#3cc0ff"/>
      <stop offset="0.55" stop-color="#0096e0"/>
      <stop offset="1" stop-color="#0077c2"/>
    </radialGradient>
    <radialGradient id="f-nose" cx="34%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff8a92"/>
      <stop offset="0.45" stop-color="#e60012"/>
      <stop offset="1" stop-color="#a3000d"/>
    </radialGradient>
    <radialGradient id="f-bell" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.4" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#d9a400"/>
    </radialGradient>
  </defs>

  <!-- 竹蜻蜓 -->
  <g stroke="#8a5a00" stroke-width="2.5" stroke-linejoin="round">
    <ellipse class="blade" cx="110" cy="12" rx="50" ry="6.5" fill="#f5b83d"/>
    <rect x="107" y="16" width="6" height="22" rx="3" fill="#8a5a00" stroke="none"/>
    <path d="M92 46 Q92 32 110 32 Q128 32 128 46 Z" fill="#ffd700"/>
  </g>

  <g stroke="#0b2540" stroke-linecap="round" stroke-linejoin="round">
    <!-- 手臂：左手伸展，右手挥舞 -->
    <path d="M70 200 Q44 196 30 180" fill="none" stroke-width="24"/>
    <path d="M70 200 Q44 196 30 180" fill="none" stroke="#0096e0" stroke-width="17"/>
    <path d="M150 200 Q178 192 190 170" fill="none" stroke-width="24"/>
    <path d="M150 200 Q178 192 190 170" fill="none" stroke="#0096e0" stroke-width="17"/>
    <circle cx="27" cy="176" r="12" fill="#ffffff" stroke-width="3.5"/>
    <circle cx="192" cy="164" r="12" fill="#ffffff" stroke-width="3.5"/>
    <!-- 脚 -->
    <ellipse cx="86" cy="256" rx="22" ry="11" fill="#ffffff" stroke-width="3.5"/>
    <ellipse cx="134" cy="256" rx="22" ry="11" fill="#ffffff" stroke-width="3.5"/>
    <!-- 身体 -->
    <path d="M64 182 Q56 238 74 250 L146 250 Q164 238 156 182 Z" fill="#0096e0" stroke-width="3.5"/>
    <ellipse cx="110" cy="216" rx="36" ry="32" fill="#ffffff" stroke-width="3.2"/>
    <path d="M86 214 H134 Q134 240 110 240 Q86 240 86 214 Z" fill="#ffffff" stroke-width="3"/>
  </g>

  <!-- 头（与 doraemon.svg 同一套造型，缩放 0.8） -->
  <g transform="translate(30 38) scale(0.8)">
    <g stroke="#0b2540" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="100" cy="98" rx="92" ry="88" fill="url(#f-head)"/>
      <path d="M100 38 C150 38 176 72 176 114 C176 156 142 180 100 180 C58 180 24 156 24 114 C24 72 50 38 100 38 Z" fill="#ffffff"/>
      <ellipse cx="81" cy="58" rx="19" ry="23" fill="#ffffff"/>
      <ellipse cx="119" cy="58" rx="19" ry="23" fill="#ffffff"/>
    </g>
    <ellipse cx="90" cy="64" rx="5.5" ry="7.5" fill="#0b2540"/>
    <ellipse cx="110" cy="64" rx="5.5" ry="7.5" fill="#0b2540"/>
    <circle cx="91.6" cy="61.4" r="2" fill="#ffffff"/>
    <circle cx="111.6" cy="61.4" r="2" fill="#ffffff"/>
    <g stroke="#0b2540" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 94 V130" fill="none"/>
      <path d="M58 122 Q100 138 142 122 Q138 174 100 174 Q62 174 58 122 Z" fill="#e8384f"/>
      <path d="M74 160 Q100 142 126 160 Q116 172 100 172 Q84 172 74 160 Z" fill="#ff8f6b" stroke-width="3"/>
      <path d="M34 78 L70 90 M30 100 L70 102 M36 122 L70 112 M166 78 L130 90 M170 100 L130 102 M164 122 L130 112" fill="none" stroke-width="3.2"/>
      <circle cx="100" cy="84" r="12" fill="url(#f-nose)" stroke-width="3.5"/>
    </g>
    <circle cx="96" cy="79.5" r="3.6" fill="#ffffff"/>
  </g>

  <!-- 项圈与铃铛 -->
  <g stroke="#0b2540" stroke-width="3" stroke-linejoin="round">
    <rect x="58" y="176" width="104" height="12" rx="6" fill="#e60012"/>
    <circle cx="110" cy="193" r="11" fill="url(#f-bell)"/>
  </g>
  <path d="M100 190 H120" stroke="#8a5a00" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="110" cy="197" r="2.6" fill="#5a3a00"/>
</svg>
